included:
  - macos/Runner

excluded:
  - macos/Flutter/GeneratedPluginRegistrant.swift

opt_in_rules:
  # Safety
  - empty_count
  - force_unwrapping
  - force_try
  # Clarity
  - implicit_return
  - trailing_comma

analyzer_rules:
  - unused_declaration
  - unused_import
  - explicit_self
  - capture_variable

# Complexity limits
cyclomatic_complexity:
  warning: 10
  error: 20

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 250
  error: 500

file_length:
  warning: 400
  error: 800

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 5

line_length:
  warning: 110
  error: 150
  ignores_urls: true
  ignores_comments: true
  ignores_function_declarations: true

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - x
    - y
    - i

type_name:
  min_length: 3
  max_length: 50

reporter: xcode
